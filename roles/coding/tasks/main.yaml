---
- name: "Setup coding environment"
  tags:
    - "coding"
  block:
    - name: Check if rebooted since the last check
      ansible.builtin.stat:
        path: "/tmp/ansible.coding-done"
      register: setup_done

    - name: Create the coding-done file
      ansible.builtin.file:
        path: "/tmp/ansible.coding-done"
        state: touch
      when: not setup_done.stat.exists

    - name: "Custom repos"
      ansible.builtin.yum_repository:
        name: "{{ repo.name }}"
        description: "{{ repo.description }}"
        baseurl: "{{ repo.baseurl }}"
        gpgkey: "{{ repo.gpgkey }}"
        enabled: true
      loop: "{{ repos }}"
      loop_control:
        loop_var: "repo"

    # DNF5 may skip updated signing subkeys when the primary key already exists.
    # Import the current key directly, as recommended by Google.
    - name: Download the current Google Linux signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/pki/rpm-gpg/google-linux-signing-key.pub
        mode: "0644"
        force: true
      register: google_signing_key

    - name: Refresh Google Linux signing subkeys in RPM
      ansible.builtin.command:
        argv:
          - rpm
          - --import
          - /etc/pki/rpm-gpg/google-linux-signing-key.pub
      changed_when: google_signing_key.changed

    - name: "Install dnf packages"
      ansible.builtin.package:
        name: "{{ item }}"
      loop:
        - code
        - golang
        - gh
        - python3-virtualenv
        - gvim
        - google-chrome-stable
        - cmake
        - gcc
        - podman
        - podman-docker
        - rvm
        - proton-vpn-cli
        - proton-vpn-gnome-desktop

    - name: Install nvm
      ansible.builtin.shell: >
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | sudo -u {{ item }} bash
      args:
        creates: "/home/{{ item }}/.nvm/nvm.sh"
      loop:
        - dinika
        - dcaro

    - name: "Install flatpack packages"
      community.general.flatpak:
        state: present
        name: "{{ item }}"
      loop:
        - io.podman_desktop.PodmanDesktop
        - com.github.iwalton3.jellyfin-media-player
      when:
        - not setup_done.stat.exists
